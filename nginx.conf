server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/rss+xml
        application/javascript
        application/json
        image/svg+xml;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Exact matches beat the regex below. These names are not content-hashed.
    # Leave add_header unset so a server-level header is not discarded.
    location = /favicon.svg {
        try_files $uri =404;
    }

    location = /favicon.ico {
        try_files $uri =404;
    }

    location ~* \.(css|js|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
